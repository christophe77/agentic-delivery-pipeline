# Workflow réutilisable : bloque toute PR ou tout push qui introduit un secret.
# Utilise le binaire gitleaks (image Docker officielle), sans licence requise.
name: agentic-secret-scan

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (épingler un tag de version en production)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code 1
