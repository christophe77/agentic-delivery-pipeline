# Reusable workflow: browser QA by Claude + Playwright MCP (headless), after deployment.
#   dev        -> after a deploy to dev (a PR deployed to dev, or a merge into the dev branch)
#   staging    -> after a deploy to staging
#   production -> after a production deploy: read-only smoke checks only
# Called by the toolkit's deploy template, or as an extra job at the end of a
# project's existing deploy workflow (templates/workflows/agentic-qa-job.yml).
name: agentic-qa

on:
  workflow_call:
    inputs:
      environment:
        description: dev | staging | production (selects the QA mode and qa.<environment>_url)
        type: string
        default: staging
      github-environment:
        description: "GitHub environment holding the QA secrets, if its name differs (e.g. development)"
        type: string
        default: ""
      commit:
        description: "Deployed commit (defaults to github.sha; pass the merge commit for PR-closed triggers)"
        type: string
        default: ""
      config-path:
        type: string
        default: .agentic/pipeline.yml
      base-url:
        description: "URL to test (defaults to qa.<environment>_url from the config file)"
        type: string
        default: ""
      toolkit-repo:
        type: string
        default: christophe77/agentic-delivery-pipeline
      toolkit-ref:
        type: string
        default: v1
      max-turns:
        type: number
        default: 60
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      MONDAY_API_TOKEN:
        required: false
      QA_USER_EMAIL:
        required: false
      QA_USER_PASSWORD:
        required: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.github-environment || inputs.environment }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 50

      - name: Pipeline configuration
        id: config
        env:
          CONFIG: ${{ inputs.config-path }}
        run: |
          if [ -f "$CONFIG" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::QA skipped: $CONFIG does not exist on the deployed commit (pipeline not set up on this branch yet)."
          fi

      - name: Agentic toolkit
        if: steps.config.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .agentic-toolkit

      - if: steps.config.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Playwright browser and MCP servers (pre-installed so they start within the MCP timeout)
        if: steps.config.outputs.skip != 'true'
        env:
          HAS_MONDAY: ${{ secrets.MONDAY_API_TOKEN != '' }}
        run: |
          npx -y playwright@latest install --with-deps chromium
          timeout 180 npx -y @playwright/mcp@latest --help > /dev/null < /dev/null || true
          if [ "$HAS_MONDAY" = "true" ]; then
            timeout 180 npx -y @mondaydotcomorg/monday-api-mcp --help > /dev/null < /dev/null || true
          fi

      - name: MCP configuration (headless Playwright, Monday if token)
        id: mcp
        if: steps.config.outputs.skip != 'true'
        env:
          QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
          QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
          CONFIG: ${{ inputs.config-path }}
          BASE_URL: ${{ inputs.base-url }}
          TARGET_ENV: ${{ inputs.environment }}
          HAS_MONDAY: ${{ secrets.MONDAY_API_TOKEN != '' }}
        run: |
          case "$TARGET_ENV" in dev|staging|production) ;; *) echo "::error::invalid environment: $TARGET_ENV"; exit 1;; esac
          url="$BASE_URL"
          [ -n "$url" ] || url=$(yq ".qa.${TARGET_ENV}_url // \"\"" "$CONFIG")
          [ -n "$url" ] || { echo "::error::No QA URL (base-url input or qa.${TARGET_ENV}_url)"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          mkdir -p .agentic/runs
          # ${MONDAY_API_TOKEN} stays literal here: Claude Code resolves it when starting
          # the MCP server, so the token is never written to disk.
          if [ "$HAS_MONDAY" = "true" ]; then
            monday=',"monday":{"command":"npx","args":["-y","@mondaydotcomorg/monday-api-mcp","-t","${MONDAY_API_TOKEN}"]}'
          else
            monday=''
          fi
          # Test credentials in a dotenv file outside the workspace (never uploaded): Playwright MCP
          # replaces these values with their names in its tool responses, so they stay out of the transcript.
          secrets_file="$RUNNER_TEMP/qa-secrets.env"
          : > "$secrets_file"
          [ -z "$QA_USER_EMAIL" ] || printf 'QA_USER_EMAIL=%s\n' "$QA_USER_EMAIL" >> "$secrets_file"
          [ -z "$QA_USER_PASSWORD" ] || printf 'QA_USER_PASSWORD=%s\n' "$QA_USER_PASSWORD" >> "$secrets_file"
          printf '%s\n' "{\"mcpServers\":{\"playwright\":{\"command\":\"npx\",\"args\":[\"-y\",\"@playwright/mcp@latest\",\"--headless\",\"--isolated\",\"--output-dir\",\".agentic/runs/qa\",\"--secrets\",\"$secrets_file\"]}${monday}}}" > .agentic/runs/mcp.json
          node -e "JSON.parse(require('fs').readFileSync('.agentic/runs/mcp.json','utf8'))"

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.config.outputs.skip != 'true'
        env:
          MCP_TIMEOUT: "120000"
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
          QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the `qa` skill of the agentic plugin on ${{ steps.mcp.outputs.url }}.
            Environment: ${{ inputs.environment }}. Deployed commit: ${{ inputs.commit || github.sha }}.
            ${{ github.event.pull_request.number && format('Triggering pull request: #{0} (base {1}).', github.event.pull_request.number, github.event.pull_request.base.ref) || '' }}
            ${{ inputs.environment == 'dev' && 'Run the QA scenarios of the triggering PR and of its Monday ticket, plus the permanent scenarios in qa.scenarios_dir. Post the report on that PR.' || '' }}
            ${{ inputs.environment == 'staging' && 'Find the PRs and Monday tickets included in this deployment (the triggering PR if it is a promotion PR, git log, gh pr list --search <sha>) and run their QA scenarios, plus the permanent scenarios in qa.scenarios_dir.' || '' }}
            ${{ inputs.environment == 'production' && 'PRODUCTION SMOKE QA, read-only: run only the scenarios in qa.production_scenarios_dir and non-mutating checks of the delivered tickets (pages load, key data visible). Never create, edit, delete, pay or send anything. Post the report on the promotion PR of this deployment.' || '' }}
            Test credentials: environment variables QA_USER_EMAIL and QA_USER_PASSWORD (never display them). To fill the login form, run Playwright code through the Playwright MCP tools that reads process.env.QA_USER_EMAIL / process.env.QA_USER_PASSWORD; never type the values yourself.
            Save every screenshot and evidence file under .agentic/runs/qa/ (the folder published as the run artifact) and write the report to .agentic/runs/qa/report.md. End with the line "QA_RESULT=PASS" or "QA_RESULT=FAIL".
          claude_args: >-
            --plugin-dir .agentic-toolkit
            --mcp-config .agentic/runs/mcp.json
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Read,Write,Grep,Glob,Task,mcp__playwright,mcp__monday,Bash(git log:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

      - name: QA report
        if: always() && steps.config.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ inputs.environment }}-${{ github.run_id }}
          path: .agentic/runs/qa/
          if-no-files-found: warn

      - name: Verdict
        if: always()
        env:
          SKIPPED: ${{ steps.config.outputs.skip }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_RAN: ${{ steps.claude.outputs.execution_file != '' }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          if [ "$SKIPPED" = "true" ]; then
            echo "QA skipped on $TARGET_ENV: no pipeline configuration on the deployed commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ! -f .agentic/runs/qa/report.md ]; then
            if [ "$CLAUDE_OUTCOME" != "success" ] && [ "$CLAUDE_RAN" != "true" ]; then
              echo "::error::QA setup or the claude step failed (outcome: $CLAUDE_OUTCOME). See the previous steps."
            elif [ "$CLAUDE_RAN" != "true" ]; then
              echo "::error::Claude did not run. Most likely the workflow validation of claude-code-action: the workflow file of this run must be identical on the repository's default branch. Merge it there, then re-run this job."
            else
              echo "::error::Claude ran but wrote no QA report (.agentic/runs/qa/report.md). See the claude step log."
            fi
            exit 1
          fi
          cat .agentic/runs/qa/report.md >> "$GITHUB_STEP_SUMMARY"
          grep -q "QA_RESULT=PASS" .agentic/runs/qa/report.md || { echo "::error::QA failed"; exit 1; }
