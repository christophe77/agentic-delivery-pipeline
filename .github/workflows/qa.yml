# Reusable workflow: browser QA by Claude + Playwright MCP (headless)
# on the staging environment, after deployment.
name: agentic-qa

on:
  workflow_call:
    inputs:
      config-path:
        type: string
        default: .agentic/pipeline.yml
      base-url:
        description: "URL to test (defaults to qa.staging_url from the config file)"
        type: string
        default: ""
      toolkit-repo:
        type: string
        default: christophe77/agentic-delivery-pipeline
      toolkit-ref:
        type: string
        default: v1
      max-turns:
        type: number
        default: 60
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      MONDAY_API_TOKEN:
        required: false
      QA_USER_EMAIL:
        required: false
      QA_USER_PASSWORD:
        required: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Agentic toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .agentic-toolkit

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Playwright browser
        run: npx -y playwright@latest install --with-deps chromium

      - name: MCP configuration (headless Playwright, Monday if token)
        id: mcp
        env:
          CONFIG: ${{ inputs.config-path }}
          BASE_URL: ${{ inputs.base-url }}
          HAS_MONDAY: ${{ secrets.MONDAY_API_TOKEN != '' }}
        run: |
          url="$BASE_URL"
          [ -n "$url" ] || url=$(yq '.qa.staging_url // ""' "$CONFIG")
          [ -n "$url" ] || { echo "::error::No QA URL (base-url input or qa.staging_url)"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          mkdir -p .agentic/runs
          # ${MONDAY_API_TOKEN} stays literal here: Claude Code resolves it when starting
          # the MCP server, so the token is never written to disk.
          if [ "$HAS_MONDAY" = "true" ]; then
            monday=',"monday":{"command":"npx","args":["-y","@mondaydotcomorg/monday-api-mcp","-t","${MONDAY_API_TOKEN}"]}'
          else
            monday=''
          fi
          printf '%s\n' "{\"mcpServers\":{\"playwright\":{\"command\":\"npx\",\"args\":[\"-y\",\"@playwright/mcp@latest\",\"--headless\",\"--isolated\",\"--output-dir\",\".agentic/runs/qa\"]}${monday}}}" > .agentic/runs/mcp.json
          node -e "JSON.parse(require('fs').readFileSync('.agentic/runs/mcp.json','utf8'))"

      - uses: anthropics/claude-code-action@v1
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
          QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the `qa` skill of the agentic plugin on ${{ steps.mcp.outputs.url }}.
            Deployed commit: ${{ github.sha }}. Find the PRs and Monday tickets for this commit
            (git log, gh pr list --search ${{ github.sha }}) and run their QA scenarios,
            plus the permanent scenarios in qa.scenarios_dir.
            Test credentials: QA_USER_EMAIL and QA_USER_PASSWORD variables (never display them).
            Write the report to .agentic/runs/qa/report.md. End with the line "QA_RESULT=PASS" or "QA_RESULT=FAIL".
          claude_args: >-
            --plugin-dir .agentic-toolkit
            --mcp-config .agentic/runs/mcp.json
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Read,Write,Grep,Glob,Task,mcp__playwright,mcp__monday,Bash(git log:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

      - name: QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.run_id }}
          path: .agentic/runs/qa/
          if-no-files-found: warn

      - name: Verdict
        run: |
          test -f .agentic/runs/qa/report.md || { echo "::error::No QA report"; exit 1; }
          cat .agentic/runs/qa/report.md >> "$GITHUB_STEP_SUMMARY"
          grep -q "QA_RESULT=PASS" .agentic/runs/qa/report.md || { echo "::error::QA failed"; exit 1; }
