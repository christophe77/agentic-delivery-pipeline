# Workflow réutilisable : lint, tests et build de chaque package déclaré
# dans .agentic/pipeline.yml. Fonctionne pour un repo simple (un package
# à la racine) comme pour un monorepo (un job par package).
name: agentic-ci

on:
  workflow_call:
    inputs:
      config-path:
        type: string
        default: .agentic/pipeline.yml

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          CONFIG: ${{ inputs.config-path }}
        run: |
          test -f "$CONFIG" || { echo "::error::$CONFIG introuvable (lancer /agentic:pipeline-init)"; exit 1; }
          packages=$(yq -o=json -I=0 '.packages' "$CONFIG")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Packages : $(yq '.packages[].name' "$CONFIG" | tr '\n' ' ')"

  build:
    needs: plan
    name: ${{ matrix.package.name }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ${{ matrix.package.runner || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.package.path }}
    steps:
      - uses: actions/checkout@v4

      # Node / NestJS / React / Tauri front
      - if: matrix.package.stack == 'node' || matrix.package.stack == 'tauri'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.package.node_version || '22' }}
      - if: (matrix.package.stack == 'node' || matrix.package.stack == 'tauri') && (matrix.package.package_manager == 'pnpm' || matrix.package.package_manager == 'yarn')
        run: corepack enable

      # .NET
      - if: matrix.package.stack == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.package.dotnet_version || '8.0.x' }}

      # Go
      - if: matrix.package.stack == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.package.go_version || 'stable' }}

      # Flutter
      - if: matrix.package.stack == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Rust (Tauri)
      - if: matrix.package.stack == 'tauri'
        uses: dtolnay/rust-toolchain@stable

      - name: install
        if: matrix.package.commands.install
        run: ${{ matrix.package.commands.install }}
      - name: lint
        if: matrix.package.commands.lint
        run: ${{ matrix.package.commands.lint }}
      - name: test
        if: matrix.package.commands.test
        run: ${{ matrix.package.commands.test }}
      - name: build
        if: matrix.package.commands.build
        run: ${{ matrix.package.commands.build }}
