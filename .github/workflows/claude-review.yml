# Workflow réutilisable : revue de code par Claude sur chaque PR, avec la
# skill review et les subagents du plugin (chargés depuis ce toolkit).
name: agentic-review

on:
  workflow_call:
    inputs:
      toolkit-repo:
        type: string
        default: christophe77/agentic-delivery-pipeline
      toolkit-ref:
        type: string
        default: v1
      max-turns:
        type: number
        default: 40
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolkit agentic
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .agentic-toolkit

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Utilise la skill `review` du plugin agentic pour relire la PR #${{ github.event.pull_request.number }}
            du repo ${{ github.repository }}. Tu es en CI : poste les findings confirmés en commentaires
            inline, puis un commentaire de synthèse. Ne merge pas et n'approuve pas la PR.
          claude_args: >-
            --plugin-dir .agentic-toolkit
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Read,Grep,Glob,Task,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
