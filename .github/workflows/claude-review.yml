# Reusable workflow: Claude code review on every PR, using the plugin's
# review skill and subagents (loaded from this toolkit).
name: agentic-review

on:
  workflow_call:
    inputs:
      toolkit-repo:
        type: string
        default: christophe77/agentic-delivery-pipeline
      toolkit-ref:
        type: string
        default: v1
      max-turns:
        type: number
        default: 60
      model:
        description: "Claude model for the review and its subagents (e.g. claude-sonnet-5-5 to halve the cost)"
        type: string
        default: claude-opus-5-5
      context-repos:
        description: "Workspace mode, sibling repos to clone read-only for context (e.g. my-org/app my-org/firmware)"
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CONTEXT_REPOS_TOKEN:
        description: "Read-only token (contents:read) for the context-repos repositories, if they are private"
        required: false

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Agentic toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.toolkit-repo }}
          ref: ${{ inputs.toolkit-ref }}
          path: .agentic-toolkit

      # Workspace mode: clone the sibling repos (same branch as the PR if it
      # exists, otherwise the default branch) to check the other side of contracts.
      - name: Sibling repos (context)
        if: inputs.context-repos != ''
        env:
          REPOS: ${{ inputs.context-repos }}
          HEAD_REF: ${{ github.head_ref }}
          TOKEN: ${{ secrets.CONTEXT_REPOS_TOKEN || github.token }}
        run: |
          mkdir -p .agentic-context
          for repo in $REPOS; do
            dest=".agentic-context/${repo#*/}"
            url="https://x-access-token:${TOKEN}@github.com/${repo}.git"
            if git ls-remote --exit-code --heads "$url" "$HEAD_REF" >/dev/null 2>&1; then
              git clone -q --depth 1 --branch "$HEAD_REF" "$url" "$dest"
              echo "$repo: branch $HEAD_REF (likely linked PR)"
            else
              git clone -q --depth 1 "$url" "$dest" || { echo "::warning::$repo not accessible"; continue; }
              echo "$repo: default branch"
            fi
            git -C "$dest" remote set-url origin "https://github.com/${repo}.git"
          done

      - name: Review start
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the `review` skill of the agentic plugin to review PR #${{ github.event.pull_request.number }}
            in the ${{ github.repository }} repo. You are running in CI: post confirmed findings as inline
            comments, then a summary comment. Report minor findings too, with their severity. Do not merge or approve the PR.
            If the .agentic-context/ folder exists, it contains the workspace's sibling repos
            (read-only): use them to check shared contracts.
            You run non-interactively: nobody can answer a question. Never stop to ask. If the Monday ticket
            or its acceptance criteria cannot be read, say so in the summary and review the code anyway.
            Always finish by posting the summary comment with gh pr comment, even when there are no findings.
          claude_args: >-
            --plugin-dir .agentic-toolkit
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Read,Grep,Glob,Task,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

      # The action hides Claude's output: keep the transcript to understand a silent run.
      - name: Review transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Review posted
        if: always() && steps.claude.outcome == 'success' && steps.claude.outputs.skipped_due_to_workflow_validation_mismatch != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?since=${SINCE}" --jq '[.[] | select(.user.type == "Bot")] | length')
          if [ "${n:-0}" -eq 0 ]; then
            echo "::error::Claude finished without posting a review comment on PR #${PR}. See the claude-review-transcript artifact."
            exit 1
          fi
          echo "Review comment posted on PR #${PR}."
