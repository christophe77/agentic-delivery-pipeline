# .agentic/pipeline.yml: NestJS backend only, deployed to AWS ECS.
# This file is versioned: it contains NO secrets, only public
# identifiers (board, resource names, URLs).
version: 1
project: my-backend

monday:
  board_id: "0000000000"
  tickets_as: subitems            # subitems | items
  groups:
    epics: Epics
    backlog: Backlog
  columns:
    status: status
    estimate: estimation
    package: package
  statuses:
    todo: To do
    in_progress: Working on it
    review: In review
    qa_passed: QA passed
    done: Done

git:
  base_branch: staging          # feature PRs target this branch; a merge deploys to staging
  production_branch: main       # fed by a promotion PR staging -> main; a merge deploys to production
  branch_pattern: "{type}/{item_id}-{slug}"

aws:
  region: eu-west-3

packages:
  - name: api
    path: .
    stack: node
    node_version: "22"
    package_manager: npm
    commands:
      install: npm ci
      lint: npm run lint
      test: npm test -- --ci
      build: npm run build
    deploy:
      target: aws-ecs
      environments: [dev, staging, production]
      dockerfile: Dockerfile
      context: .
      ecr_repository: my-backend-api
      ecs:
        container: api
        dev:
          cluster: my-cluster-dev
          service: api-dev
          task_family: api-dev
        staging:
          cluster: my-cluster-staging
          service: api-staging
          task_family: api-staging
        production:
          cluster: my-cluster-prod
          service: api-prod
          task_family: api-prod

qa:
  dev_url: https://api.dev.example.com            # PR QA, next to the code review
  staging_url: https://api.staging.example.com
  production_url: https://api.example.com            # read-only smoke QA after release
  scenarios_dir: .agentic/qa
  production_scenarios_dir: .agentic/qa/production   # read-only scenarios only
  credentials_env: [QA_USER_EMAIL, QA_USER_PASSWORD]

gates:
  epic_approval: true          # human approval before creating items in Monday
  production_approval: true    # enforced by the "production" GitHub environment
