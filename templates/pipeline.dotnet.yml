# .agentic/pipeline.yml: C# / .NET service (e.g. a Windows service
# or an embedded agent) published as a GitHub Release, on a Windows runner.
# No secrets in this file.
version: 1
project: my-dotnet-service

monday:
  board_id: "0000000000"
  tickets_as: subitems
  groups:
    epics: Epics
    backlog: Backlog
  columns:
    status: status
  statuses:
    todo: To do
    in_progress: Working on it
    review: In review
    qa_passed: QA passed
    done: Done

git:
  base_branch: main
  branch_pattern: "{type}/{item_id}-{slug}"

packages:
  - name: agent
    path: .
    stack: dotnet
    dotnet_version: 8.0.x
    runner: windows-latest        # net8.0-windows; ubuntu-latest otherwise
    commands:
      install: dotnet restore
      lint: dotnet format --verify-no-changes
      test: dotnet test --no-restore --logger trx
      build: dotnet build --no-restore -c Release
    deploy:
      target: github-release
      environments: [staging, production]   # staging = prerelease
      build: dotnet publish src/Agent/Agent.csproj -c Release -r win-x64 --self-contained -o out && powershell -Command "Compress-Archive -Path out/* -DestinationPath agent-win-x64.zip"
      artifacts: agent-win-x64.zip
      tag_prefix: agent-v

# No UI, so browser QA does not apply. Acceptance criteria
# are covered by the integration tests.
gates:
  epic_approval: true
  production_approval: true
