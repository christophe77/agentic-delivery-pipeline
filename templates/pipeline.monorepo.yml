# .agentic/pipeline.yml: monorepo (Turborepo / pnpm workspaces) with
# a NestJS backend, a React portal, a Tauri app and a Go service.
# One package = one CI job and, if it has a deploy block, one deployment.
# No secrets in this file.
version: 1
project: my-monorepo

monday:
  board_id: "0000000000"
  tickets_as: subitems
  groups:
    epics: Epics
    backlog: Backlog
  columns:
    status: status
    package: package
  statuses:
    todo: To do
    in_progress: Working on it
    review: In review
    qa_passed: QA passed
    done: Done

git:
  base_branch: main
  branch_pattern: "{type}/{item_id}-{slug}"

aws:
  region: eu-west-3

packages:
  - name: api
    path: apps/api
    stack: node
    package_manager: pnpm
    commands:
      install: pnpm install --frozen-lockfile
      lint: pnpm turbo run lint --filter=api
      test: pnpm turbo run test --filter=api
      build: pnpm turbo run build --filter=api
    deploy:
      target: aws-ecs
      dockerfile: Dockerfile           # relative to path
      context: ../..                 # relative to path, i.e. the monorepo root
      ecr_repository: my-monorepo-api
      ecs:
        container: api
        staging: { cluster: cluster-staging, service: api-staging, task_family: api-staging }
        production: { cluster: cluster-prod, service: api-prod, task_family: api-prod }

  - name: portal
    path: apps/portal
    stack: node
    package_manager: pnpm
    commands:
      install: pnpm install --frozen-lockfile
      lint: pnpm turbo run lint --filter=portal
      test: pnpm turbo run test --filter=portal
      build: pnpm turbo run build --filter=portal
    deploy:
      target: command
      aws: true                      # injects the OIDC credentials
      command: pnpm turbo run build --filter=portal && aws s3 sync dist "s3://portal-$TARGET_ENV" --delete && aws cloudfront create-invalidation --distribution-id "$(aws ssm get-parameter --name /portal/$TARGET_ENV/distribution-id --query Parameter.Value --output text)" --paths "/*"

  - name: desktop-app
    path: apps/desktop
    stack: tauri
    runner: windows-latest
    package_manager: pnpm
    commands:
      install: pnpm install --frozen-lockfile
      lint: pnpm lint
      test: pnpm test
    deploy:
      target: github-release
      environments: [production]
      build: pnpm tauri build
      artifacts: src-tauri/target/release/bundle/**/*.msi
      tag_prefix: desktop-v

  - name: edge-service
    path: services/edge
    stack: go
    commands:
      lint: go vet ./...
      test: go test ./...
      build: go build ./...

qa:
  staging_url: https://portal.staging.example.com
  scenarios_dir: .agentic/qa
  credentials_env: [QA_USER_EMAIL, QA_USER_PASSWORD]

gates:
  epic_approval: true
  production_approval: true
