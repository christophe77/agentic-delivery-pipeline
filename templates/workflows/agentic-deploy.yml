# Copied by /agentic:pipeline-init.
# Two long-lived branches, one per environment:
#   push to staging -> CI -> deploy staging -> browser QA on staging
#   push to main    -> CI -> deploy production (human approval) -> smoke QA on production
# main is fed by a promotion PR staging -> main (/agentic:release prepare) after a green staging QA.
# Can also be run manually: gh workflow run agentic-deploy.yml -f environment=production
# Adapt the branch names below if git.base_branch / git.production_branch differ.
name: Deploy

on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
      version:
        type: string
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: christophe77/agentic-delivery-pipeline/.github/workflows/ci.yml@v1

  staging:
    needs: ci
    if: >-
      (github.event_name == 'push' && github.ref_name == 'staging') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    permissions:
      contents: write
      id-token: write
    uses: christophe77/agentic-delivery-pipeline/.github/workflows/deploy.yml@v1
    with:
      environment: staging
      version: ${{ inputs.version }}

  qa-staging:
    needs: staging
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: christophe77/agentic-delivery-pipeline/.github/workflows/qa.yml@v1
    with:
      environment: staging
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
      QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
      QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}

  production:
    # On a push to main (merged promotion PR), or manually. The "production"
    # GitHub environment must have required reviewers: that is the human gate.
    needs: ci
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    permissions:
      contents: write
      id-token: write
    uses: christophe77/agentic-delivery-pipeline/.github/workflows/deploy.yml@v1
    with:
      environment: production
      version: ${{ inputs.version }}

  qa-production:
    # Read-only smoke QA on production right after the deployment.
    needs: production
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: christophe77/agentic-delivery-pipeline/.github/workflows/qa.yml@v1
    with:
      environment: production
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
      QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
      QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
