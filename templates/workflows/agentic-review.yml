# Copied by /agentic:pipeline-init. Claude review when a PR is opened and on every push.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # No review on PRs from forks (no access to secrets, by design).
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: christophe77/agentic-delivery-pipeline/.github/workflows/claude-review.yml@v1
    with:
      toolkit-ref: v1
      # Workspace mode: sibling repos to provide as context (empty in repo mode).
      context-repos: ""
    # Secrets passed explicitly: `secrets: inherit` does not work
    # across different accounts/organizations (toolkit on one account, project on another).
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CONTEXT_REPOS_TOKEN: ${{ secrets.CONTEXT_REPOS_TOKEN }}
