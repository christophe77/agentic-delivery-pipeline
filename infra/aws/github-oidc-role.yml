# CloudFormation: IAM role assumed by GitHub Actions through OIDC.
# No AWS access key is created or stored: GitHub obtains temporary
# credentials (1 h) only for the given repo and environment.
#
# Deploy one stack per environment (staging, production):
#   aws cloudformation deploy --template-file infra/aws/github-oidc-role.yml \
#     --stack-name gh-oidc-myrepo-staging --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides GitHubOwner=my-org GitHubRepo=my-repo Environment=staging \
#       CreateOidcProvider=true PolicyArns=arn:aws:iam::aws:policy/...
# Then: gh variable set AWS_ROLE_ARN --env staging --body "<RoleArn output>"
AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC role for the agentic pipeline

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub organization or account (e.g. my-org)
  GitHubRepo:
    Type: String
    Description: Repository name
  Environment:
    Type: String
    AllowedValues: [staging, production]
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: true only for the first stack in the AWS account
  PolicyArns:
    Type: CommaDelimitedList
    Description: Managed policies attached to the role (least privilege, see docs/security.md)

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub gh-${GitHubRepo}-${Environment}
      MaxSessionDuration: 3600
      ManagedPolicyArns: !Ref PolicyArns
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs from THIS repo in THIS GitHub environment can assume the role.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}/${GitHubRepo}:environment:${Environment}

Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
